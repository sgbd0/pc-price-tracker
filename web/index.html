<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装机价格雷达 · 电脑配件价格看板</title>
<style>
:root{--up:#e04545;--down:#189a5c;--flat:#8a93a3;--bg:#f5f6fa;--card:#fff;--line:#e9ecf3;--txt:#1b2233;--sub:#6b7690;--acc:#3d5afe;--jd:#e1251b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,-apple-system,sans-serif}
.topbar{background:linear-gradient(120deg,#1c2640,#2c3e6e 55%,#3d5afe22);color:#fff;padding:18px 0 46px}
.topbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.topbar h1{font-size:20px;margin:0;letter-spacing:.5px}
.topbar .meta{color:#c6d2f2;font-size:12.5px}
.chip{font-size:12px;border-radius:999px;padding:3px 10px;background:#ffffff22;border:1px solid #ffffff33;color:#e8eeff}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.body{max-width:1100px;margin:-34px auto 0;padding:0 16px 48px}
.panel{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(22,32,64,.07);padding:16px;margin-bottom:14px}
.panel h2{font-size:14.5px;margin:0 0 10px}
.hero{background:linear-gradient(120deg,#ffffff,#f2f5ff);border:1px solid #dde5ff}
.hero .tag{display:inline-block;font-size:11px;color:#fff;background:var(--acc);border-radius:4px;padding:1px 7px;margin-right:8px;vertical-align:2px}
.focus{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:16px;margin:4px 0 8px}
.focus b{font-size:19px}
.hero .sum{color:#3c4763;font-size:13.5px;line-height:1.7}
.picks{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.picks span{font-size:12.5px;background:#eef3ff;border:1px solid #d9e4ff;border-radius:999px;padding:4px 12px;color:#2a3c8f}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border-radius:14px;padding:12px 15px;box-shadow:0 2px 10px rgba(22,32,64,.07)}
.card .n{font-size:22px;font-weight:700}.card .t{color:var(--sub);font-size:11.5px;margin-top:2px}
.card.clk{cursor:pointer;transition:transform .12s,box-shadow .12s}
.card.clk:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(22,32,64,.14)}
.card.clk.act{outline:2px solid var(--acc);outline-offset:2px}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.ranks{grid-template-columns:1fr}}
.rk{font-size:13px}.rk div{padding:4px 0;border-bottom:1px dashed #eef1f6;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.rk div:hover{background:#f6f9ff}
.star{cursor:pointer;color:#c9d2e0;font-size:16px;margin-right:4px;user-select:none;-webkit-user-select:none;display:inline-block;padding:6px;margin:-4px;touch-action:manipulation}
.star.on{color:#f5a623}
.adv-avoid{color:#b32323;font-weight:700}
@media(max-width:720px){
  table{min-width:860px}
  .tblwrap{overflow:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:7px 6px;font-size:12.5px}
  .topbar h1{font-size:17px}
  .topbar .meta{font-size:11.5px}
}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input[type=search],select,button.btn{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--txt)}
input[type=search]{min-width:160px;flex:1;max-width:280px}
button.btn{cursor:pointer}button.btn:hover{border-color:var(--acc);color:var(--acc)}
.range button{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.range button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#chart-box{position:relative}
#tooltip{position:absolute;pointer-events:none;background:#111828;color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;display:none;white-space:nowrap;z-index:5}
.tblwrap{max-height:640px;overflow:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:11.5px;background:#f8fafd;position:sticky;top:0;z-index:2}
td.name{white-space:normal;min-width:230px;max-width:350px}
.cat-tag{display:inline-block;font-size:11px;color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.jdtag{font-size:11px;color:#fff;background:var(--jd);border-radius:4px;padding:1px 5px;margin-right:4px}
tbody tr{cursor:pointer}tbody tr:hover{background:#f6f9ff}tbody tr.sel{background:#eef3ff}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.price{font-weight:700}.bargain{color:#0d7a3e;font-weight:700}
.pct{font-weight:600}
.adv-bargain{color:#0d7a3e;font-weight:700}.adv-good{color:#189a5c}.adv-bad{color:#e04545}.adv-flat{color:var(--flat)}
.gap-good{color:#0d7a3e;font-weight:600}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.count{color:var(--sub);font-size:12px;margin-left:auto}
.statline{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:12.5px;margin-top:10px}
.statline b{color:var(--txt)}
footer{color:var(--sub);font-size:12px;margin:12px 0 0;line-height:1.8;text-align:center}
@media(max-width:720px){.hidem{display:none}td.name{min-width:170px}}
html[data-theme=dark]{--bg:#111521;--card:#1a2130;--line:#2a3347;--txt:#e7ecf7;--sub:#8b95ad}
html[data-theme=dark] .topbar{background:linear-gradient(120deg,#0d1220,#1a2540 55%,#3d5afe22)}
html[data-theme=dark] .hero{background:linear-gradient(120deg,#1a2130,#20304e);border-color:#2c3a58}
html[data-theme=dark] .hero .sum{color:#c0c9dd}
html[data-theme=dark] .picks span{background:#223354;border-color:#33477a;color:#b9c8ee}
html[data-theme=dark] th{background:#161d2b}
html[data-theme=dark] tbody tr:hover,html[data-theme=dark] .rk div:hover{background:#212a3d}
html[data-theme=dark] tbody tr.sel{background:#233350}
html[data-theme=dark] input[type=search],html[data-theme=dark] select,html[data-theme=dark] button.btn,html[data-theme=dark] .range button{background:#1a2130;color:var(--txt)}
html[data-theme=dark] #tooltip{background:#e7ecf7;color:#111828}
.bell{cursor:pointer;font-size:13px;margin-right:2px;opacity:.35;user-select:none;-webkit-user-select:none;padding:6px 4px;margin-left:-8px;touch-action:manipulation;display:inline-block}
.bell.set{opacity:.85}
.bell.hit{opacity:1;animation:bp 1.2s infinite}
@keyframes bp{50%{transform:scale(1.3)}}
tr.alr td{background:#fff1ee}
html[data-theme=dark] tr.alr td{background:#3a2622}
.alr-item{display:inline-block;background:#fdeeea;border:1px solid #f5c6bd;border-radius:8px;padding:2px 8px;margin:2px 4px;font-size:12px;cursor:pointer}
html[data-theme=dark] .alr-item{background:#3a2622;border-color:#5a3a32}
.alr-item i{font-style:normal;margin-left:6px;color:#b0554a;cursor:pointer;font-weight:700}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px 14px}
.bgrid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
.bgrid select{width:100%}
.btot{margin-top:10px;font-size:13.5px;color:var(--sub);line-height:1.6}
.ct{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:3px 0;cursor:pointer}
.ct:hover{background:var(--bg)}
.ctl{width:64px;color:var(--sub);flex:none}
.ctbar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.ctbar i{display:block;height:100%}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <h1>📡 装机价格雷达</h1>
  <span class="meta" id="updated"></span>
  <span class="chip" id="daybadge"></span>
  <span class="chip">👁 全网 <b id="gv">…</b> 次</span>
  <span class="chip">👥 全网 <b id="gu">…</b> 人</span>
  <span class="chip" id="thBtn" style="cursor:pointer">🌙 主题</span>
</div></div>

<div class="body">
  <div class="panel hero" id="aiPanel" style="display:none"></div>

  <div class="panel" id="alertPanel" style="display:none"></div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <div class="ranks">
      <div><h2>📈 今日涨幅 TOP5</h2><div class="rk" id="rankUp"></div></div>
      <div><h2>📉 今日跌幅 TOP5</h2><div class="rk" id="rankDown"></div></div>
    </div>
    <div id="catTrend"></div>
  </div>

  <div class="panel" id="buildPanel" style="display:none">
    <h2>🛠️ 装机清单 <span style="color:var(--sub);font-size:12px;font-weight:400">按类别选配，实时计算参考总价与渠道最优总价（保存在本机浏览器）</span></h2>
    <div id="buildBody"></div>
    <div class="controls" style="margin-top:10px"><button class="btn" id="buildClear">清空清单</button></div>
  </div>

  <div class="panel">
    <h2>价格走势 <span id="chart-title" style="color:var(--sub);font-size:12px;font-weight:400"></span></h2>
    <div class="controls">
      <select id="pick"></select>
      <span class="range" id="range">
        <button data-n="-1">今日分时</button>
        <button data-n="30" class="on">近30天</button>
        <button data-n="90">近90天</button>
        <button data-n="0">全部</button>
      </span>
    </div>
    <div id="chart-box">
      <svg id="chart" viewBox="0 0 880 300" width="100%"></svg>
      <div id="tooltip"></div>
    </div>
  </div>

  <div class="panel">
    <div class="controls">
      <input type="search" id="search" placeholder="搜索配件名称…">
      <select id="catSel"></select>
      <select id="sortSel">
        <option value="cat">排序：分类</option>
        <option value="pct">排序：今日涨跌</option>
        <option value="gap">排序：距白菜价</option>
        <option value="price">排序：价格</option>
        <option value="pct30">排序：30天走势</option>
        <option value="fav">排序：收藏优先</option>
      </select>
      <button class="btn" id="onlyFav">★ 只看收藏</button>
      <button class="btn" id="fadvChip" style="display:none"></button>
      <button class="btn" id="exportCsv">⬇ 导出CSV</button>
      <button class="btn" id="buildBtn">🛠️ 装机清单</button>
      <span class="count" id="count"></span>
    </div>
    <div class="tblwrap">
    <table>
      <thead><tr><th>商品</th><th>参考价</th><th>渠道价</th><th>涨跌</th><th>🥬 白菜价</th><th>距白菜价</th><th class="hidem">30天走势</th><th>建议</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    </div>
    <div class="statline" id="stats"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const UP='#e04545', DOWN='#189a5c', FLAT='#8a93a3';
const CAT_COLORS={'CPU':'#5b6ee1','主板':'#8e5bd1','内存':'#d1843b','显卡':'#3ba7a0','固态硬盘':'#4f9d5d','机械硬盘':'#7a8b3c','电源':'#c26a1f','机箱':'#b05a6e','散热器':'#3c8bbf','显示器':'#c95570','键盘':'#946b2d','鼠标':'#5f8a4b','配件':'#8a93a3'};
let DATA=null, ITEMS=[], S={}, sel=0, rangeN=30, hoverX=-1, fCat='全部', fSearch='', fSort='cat', onlyFav=false, fAdv=null;
let FAVS=(()=>{try{return new Set(JSON.parse(localStorage.getItem('ppf')||'[]'))}catch(e){return new Set()}})();
let visits=(+localStorage.getItem('ppv')||0)+1; localStorage.setItem('ppv',visits);
let ALERTS=(()=>{try{return JSON.parse(localStorage.getItem('ppa')||'{}')}catch(e){return{}}})();
const saveAlerts=()=>localStorage.setItem('ppa',JSON.stringify(ALERTS));
let BUILD=(()=>{try{return JSON.parse(localStorage.getItem('ppb')||'{}')}catch(e){return{}}})();
const saveBuild=()=>localStorage.setItem('ppb',JSON.stringify(BUILD));
const saveFavs=()=>localStorage.setItem('ppf',JSON.stringify([...FAVS]));
const fmt=n=>n==null?'-':'¥'+n.toLocaleString('zh-CN',{maximumFractionDigits:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  let r;
  try{r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)throw 0;}
  catch(e){r=await fetch('data.json',{cache:'no-store'});}
  DATA=await r.json();
  ITEMS=DATA.items.filter(it=>it.price!=null);
  S={};for(const it of ITEMS)S[it.name]=stats(it);
  render();
}

function stats(it){
  const v=(it.history||[]).map(h=>h.p);
  const last30=v.slice(-30);
  const min=Math.min(...v),max=Math.max(...v);
  const avg30=last30.length?last30.reduce((a,b)=>a+b,0)/last30.length:null;
  const pct30=(last30.length>1)?(v[v.length-1]-last30[0])/last30[0]*100:null;
  // 白菜价 = 网上真实渠道价(京东/商家)与记录期最低价中的最低，bsrc 标来源
  const chans=[[it.jd,'京'],[it.shop,'商']].filter(x=>x[0]!=null);
  let bargain=min, bsrc='史';
  for(const [p,tag] of chans){ if(p<bargain){bargain=p;bsrc=tag;} }
  const webMin=chans.length?Math.min(...chans.map(x=>x[0])):null;
  const gap=(bargain>0&&v.length)?(it.price-bargain)/bargain*100:null;
  return {min,max,avg30,pct30,gap,len:v.length,bargain,bsrc,webMin};
}

function advice(it,s){
  if(s.len<2)return {t:'数据积累中',c:'flat'};
  if(it.price<=s.bargain*1.02)return {t:'🥬 白菜价，可入',c:'bargain'};
  if(s.webMin!=null&&s.webMin<it.price*0.88)return {t:'⛔ 渠道价仅¥'+Math.round(s.webMin)+'，别按参考价入',c:'avoid'};
  if(s.gap!=null&&s.gap>=12)return {t:'⛔ 高出白菜价'+s.gap.toFixed(0)+'%，特别不建议入',c:'avoid'};
  if(s.max!=null&&it.price>=s.max*0.995&&s.gap!=null&&s.gap>=6)return {t:'⛔ 处于区间高位，不建议入',c:'avoid'};
  if(s.pct30!=null&&s.pct30>=5)return {t:'⛔ 30天连涨'+s.pct30.toFixed(0)+'%，不建议追高',c:'avoid'};
  if(s.avg30&&it.price<=s.avg30*0.95)return {t:'低于30天均价'+((1-it.price/s.avg30)*100).toFixed(1)+'%，可考虑',c:'good'};
  if(s.pct30!=null&&s.pct30<=-5)return {t:'30天走低'+Math.abs(s.pct30).toFixed(0)+'%，可再等',c:'good'};
  if(s.avg30&&it.price>=s.avg30*1.05)return {t:'高于30天均价'+((it.price/s.avg30-1)*100).toFixed(1)+'%，观望',c:'bad'};
  return {t:'价格平稳',c:'flat'};
}

const pctSpan=p=>{
  if(p==null)return '<span class="flat">新增</span>';
  if(p>0.05)return `<span class="pct up">▲ +${p.toFixed(1)}%</span>`;
  if(p<-0.05)return `<span class="pct down">▼ ${p.toFixed(1)}%</span>`;
  return '<span class="flat">—</span>';
};

function render(){
  document.getElementById('updated').textContent='更新于 '+(DATA.updated||'')+' · 每小时自动刷新';
  const st=DATA.stats||{};
  const maxDays=ITEMS.length?Math.max(...ITEMS.map(i=>i.days||1)):1;
  document.getElementById('daybadge').textContent='数据覆盖 '+maxDays+' 天';

  const withA=ITEMS.map(it=>({it,s:S[it.name],a:advice(it,S[it.name])}));
  const bargains=withA.filter(x=>x.a.c==='bargain');
  const avoids=withA.filter(x=>x.a.c==='avoid');
  const ups=withA.filter(x=>x.it.pct!=null&&x.it.pct>0.05);
  const downs=withA.filter(x=>x.it.pct!=null&&x.it.pct<-0.05);
  const pcts=withA.filter(x=>x.it.pct!=null).map(x=>x.it.pct);
  const avg=pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:0;
  document.getElementById('cards').innerHTML=
    card(ITEMS.length,'监控配件',null,'all')+
    card(bargains.length,'🥬 已到白菜价','#0d7a3e','bargain')+
    card(avoids.length,'⛔ 不建议入','#b32323','avoid')+
    card(ups.length,'今日上涨',UP,'up')+
    card(downs.length,'今日下跌',DOWN,'down')+
    card(pcts.length?avg.toFixed(2):'0.00','平均涨跌 %',avg<-0.05?DOWN:(avg>0.05?UP:FLAT));
  // 点击卡片即筛选对应配件并定位到列表（白菜价/上涨/下跌；再点一次取消）
  document.querySelectorAll('.card.clk').forEach(c=>c.onclick=()=>{
    const f=c.dataset.f;
    fAdv=(f==='all')?null:(fAdv===f?null:f);
    syncAdv();renderRows();
    document.querySelector('.tblwrap').scrollIntoView({behavior:'smooth',block:'start'});
  });

  const rk=(list,cls)=>list.length?list.map(x=>
    `<div data-n="${esc(x.it.name)}"><span>${esc(x.it.name)}</span><span class="pct ${cls}">${x.it.pct>0?'+':''}${x.it.pct.toFixed(1)}%</span></div>`).join('')
    :'<span style="color:var(--sub)">今日暂无</span>';
  document.getElementById('rankUp').innerHTML=rk([...ups].sort((a,b)=>b.it.pct-a.it.pct).slice(0,5),'up');
  document.getElementById('rankDown').innerHTML=rk([...downs].sort((a,b)=>a.it.pct-b.it.pct).slice(0,5),'down');
  document.querySelectorAll('.rk div').forEach(d=>d.onclick=()=>{
    const i=ITEMS.findIndex(x=>x.name===d.dataset.n);
    if(i>=0){sel=i;pick.value=i;drawChart();markSel();window.scrollTo({top:0,behavior:'smooth'});}
  });

  const cats=['全部',...new Set(DATA.items.map(it=>it.cat||'配件'))];
  const catCount={};for(const it of DATA.items)catCount[it.cat||'配件']=(catCount[it.cat||'配件']||0)+1;
  const catSel=document.getElementById('catSel');
  catSel.innerHTML=cats.map(c=>`<option value="${c}">${c==='全部'?'全部分类':c+' ('+(catCount[c]||0)+')'}</option>`).join('');
  catSel.value=cats.includes(fCat)?fCat:'全部';

  const pick=document.getElementById('pick');
  pick.innerHTML=ITEMS.map((it,i)=>`<option value="${i}">${it.cat} · ${it.name}</option>`).join('');
  pick.value=Math.min(sel,Math.max(ITEMS.length-1,0));
  pick.onchange=e=>{sel=+e.target.value;drawChart();markSel();};

  renderRows();markSel();drawChart();
  renderAlerts();renderCatTrend();
  if(document.getElementById('buildPanel').style.display!=='none')renderBuild();

  document.getElementById('stats').innerHTML=
    `<span>累计价格记录 <b>${(st.records||0).toLocaleString()}</b> 条</span>`+
    `<span>数据覆盖 <b>${st.days||maxDays}</b> 天</span>`+
    `<span>累计监控 <b>${st.items||ITEMS.length}</b> 款</span>`+
    `<span>你已访问 <b>${visits}</b> 次</span>`+
    `<span>🔔 提醒 <b>${Object.keys(ALERTS).length}</b> 项</span>`+
    `<span>收藏 <b>${FAVS.size}</b> 款</span>`;
  document.getElementById('foot').innerHTML=
    `数据来源: ZOL 参考报价 + 京东渠道价（京）+ ZOL商家最低价（商）· 每小时自动更新 · 🥬 白菜价=网上渠道(京东/商家)与记录期的最低价，京/商/史为来源<br>30天前历史含估算回填（图表虚线），实测逐日替换 · ⛔ 高位/连涨/远高于白菜价会明确标注"不建议入" · 建议仅供参考`;
}

const card=(n,t,c,f)=>`<div class="card ${f&&f!=='avg'?'clk':''}" ${f?`data-f="${f}"`:''}><div class="n" ${c?`style="color:${c}"`:''}>${n}</div><div class="t">${t}</div></div>`;

const ADV_NAMES={bargain:'🥬 白菜价',avoid:'⛔ 不建议入',up:'今日上涨',down:'今日下跌'};
function syncAdv(){
  const chip=document.getElementById('fadvChip');
  document.querySelectorAll('.card.clk').forEach(c=>c.classList.toggle('act',c.dataset.f===fAdv));
  if(fAdv){chip.style.display='';chip.textContent='✕ 取消筛选: '+ADV_NAMES[fAdv];}
  else chip.style.display='none';
}

function visible(){
  let list=ITEMS.map((it,idx)=>({it,idx,s:S[it.name]}));
  if(fCat!=='全部')list=list.filter(x=>x.it.cat===fCat);
  if(fSearch)list=list.filter(x=>x.it.name.toLowerCase().includes(fSearch));
  if(onlyFav)list=list.filter(x=>FAVS.has(x.it.name));
  if(fAdv==='bargain')list=list.filter(x=>x.s.len>=2&&x.it.price<=x.s.bargain*1.02);
  if(fAdv==='avoid')list=list.filter(x=>['avoid'].includes(advice(x.it,x.s).c));
  if(fAdv==='up')list=list.filter(x=>x.it.pct!=null&&x.it.pct>0.05);
  if(fAdv==='down')list=list.filter(x=>x.it.pct!=null&&x.it.pct<-0.05);
  const sorters={
    cat:(a,b)=>(FAVS.has(b.it.name)-FAVS.has(a.it.name))||((a.it.cat===b.it.cat)?(Math.abs(b.it.pct||0)-Math.abs(a.it.pct||0)):a.it.cat.localeCompare(b.it.cat,'zh')),
    fav:(a,b)=>(FAVS.has(b.it.name)-FAVS.has(a.it.name))||a.it.name.localeCompare(b.it.name,'zh'),
    pct:(a,b)=>(a.it.pct??-999)-(b.it.pct??-999),
    gap:(a,b)=>(a.s.gap??999)-(b.s.gap??999),
    price:(a,b)=>a.it.price-b.it.price,
    pct30:(a,b)=>(a.s.pct30??999)-(b.s.pct30??999)
  };
  return list.sort(sorters[fSort]||sorters.cat);
}

function renderRows(){
  const list=visible();
  document.getElementById('count').textContent=`共 ${list.length} 款`;
  if(!list.length){
    document.getElementById('rows').innerHTML='<tr><td colspan="8" style="color:var(--sub);text-align:center;padding:26px">没有符合当前筛选的配件</td></tr>';
    return;
  }
  document.getElementById('rows').innerHTML=list.map(({it,idx,s})=>{
    const a=advice(it,s);
    const col=CAT_COLORS[it.cat]||'#8a93a3';
    const gapTxt=s.gap==null?'-':(s.gap<=0.5?'<span class="gap-good">触底</span>':`+${s.gap.toFixed(1)}%`);
    const fav=FAVS.has(it.name);
    const tgt=ALERTS[it.name];
    const hit=tgt&&it.price!=null&&it.price<=tgt;
    return `<tr data-i="${idx}" class="${hit?'alr':''}">
      <td class="name"><span class="bell ${tgt?'set':''} ${hit?'hit':''}" data-alert="${esc(it.name)}">🔔</span><span class="star ${fav?'on':''}" data-fav="${esc(it.name)}">${fav?'★':'☆'}</span><span class="cat-tag" style="background:${col}">${it.cat}</span><a href="${it.url}" target="_blank" onclick="event.stopPropagation()">${esc(it.name)}</a></td>
      <td class="price">${fmt(it.price)}</td>
      <td>${it.jd!=null?`<span class="jdtag">京</span>${fmt(it.jd)}`:(it.shop!=null?`<span class="jdtag" style="background:#3c8bbf">商</span>${fmt(it.shop)}`:'—')}</td>
      <td>${pctSpan(it.pct)}</td>
      <td class="${a.c==='bargain'?'bargain':''}">${s.bargain!=null?fmt(s.bargain):'—'}<span style="font-size:10px;color:var(--sub);margin-left:3px">${s.bsrc}</span></td>
      <td>${gapTxt}</td>
      <td class="hidem">${spark(it.history)}</td>
      <td class="adv-${a.c}">${a.t}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('#rows tr').forEach(()=>{});
}
// 行内点击统一委托：优先星标收藏（放大命中区，兼容触屏），否则选中走势图
document.getElementById('rows').addEventListener('click',e=>{
  const bell=e.target.closest('[data-alert]');
  if(bell){
    e.preventDefault();e.stopPropagation();
    const n=bell.dataset.alert;
    const it2=ITEMS.find(x=>x.name===n), s2=it2?S[n]:null;
    const suggest=(s2&&s2.bargain)?Math.round(s2.bargain):(it2?Math.round(it2.price*0.9):'');
    const v=prompt('🔔 目标价：到价即提醒（输入0清除）——'+n, ALERTS[n]||suggest);
    if(v===null)return;
    const num=parseFloat(v);
    if(!num||num<=0)delete ALERTS[n];else ALERTS[n]=num;
    saveAlerts();renderAlerts();renderRows();return;
  }
  const star=e.target.closest('[data-fav]');
  if(star){
    e.preventDefault();e.stopPropagation();
    const n=star.dataset.fav;
    FAVS.has(n)?FAVS.delete(n):FAVS.add(n);
    saveFavs();renderRows();return;
  }
  const tr=e.target.closest('tr');
  if(tr&&tr.dataset.i!==undefined){
    sel=+tr.dataset.i;pick.value=sel;drawChart();markSel();
  }
});

function markSel(){document.querySelectorAll('#rows tr').forEach(tr=>tr.classList.toggle('sel',+tr.dataset.i===sel));}

function renderAlerts(){
  const el=document.getElementById('alertPanel');
  const names=Object.keys(ALERTS);
  if(!names.length){el.style.display='none';return;}
  const hitRows=[],wait=[];
  for(const n of names){
    const it=ITEMS.find(x=>x.name===n);
    if(!it){delete ALERTS[n];continue;}
    const t=ALERTS[n];
    (it.price!=null&&it.price<=t?hitRows:wait).push({n,it,t});
  }
  if(!hitRows.length&&!wait.length){el.style.display='none';return;}
  let html=`🔔 <b>价格提醒</b> `;
  if(hitRows.length){
    html+=`<span style="color:#c0392b"><b>${hitRows.length} 项已到价！</b></span> `+
      hitRows.map(x=>`<span class="alr-item" data-jump="${esc(x.n)}">${esc(x.n)} ${fmt(x.it.price)} ≤ 目标¥${x.t}<i data-del="${esc(x.n)}">✕</i></span>`).join('')+' ';
  }
  html+=`<span style="color:var(--sub)">待触发 ${wait.length} 项（点击行内🔔可修改/清除）</span>`;
  el.innerHTML=html;el.style.display='';
  el.querySelectorAll('[data-del]').forEach(i=>i.onclick=e=>{e.stopPropagation();delete ALERTS[i.dataset.del];saveAlerts();renderAlerts();renderRows();});
  el.querySelectorAll('.alr-item').forEach(s=>s.onclick=()=>{
    const i=ITEMS.findIndex(x=>x.name===s.dataset.jump);
    if(i>=0){sel=i;pick.value=i;drawChart();markSel();}
  });
}

function renderCatTrend(){
  const el=document.getElementById('catTrend');
  const agg={};
  for(const it of ITEMS){const s=S[it.name];if(s&&s.pct30!=null){(agg[it.cat]=agg[it.cat]||[]).push(s.pct30);}}
  const rows=Object.entries(agg).map(([c,a])=>[c,a.reduce((x,y)=>x+y,0)/a.length]).sort((a,b)=>a[1]-b[1]);
  if(!rows.length){el.innerHTML='';return;}
  const mx=Math.max(...rows.map(r=>Math.abs(r[1])),1);
  el.innerHTML='<h2 style="margin-top:14px">📊 板块 30 天动向（分类均值，点击筛选）</h2>'+
    rows.map(([c,p])=>`<div class="ct" data-cat="${c}"><span class="ctl">${c}</span><span class="ctbar"><i style="width:${(Math.abs(p)/mx*100).toFixed(0)}%;background:${p<0?'var(--down)':'var(--up)'}"></i></span><span class="${p<0?'down':'up'}" style="width:56px;text-align:right;flex:none">${p.toFixed(1)}%</span></div>`).join('');
  el.querySelectorAll('.ct').forEach(d=>d.onclick=()=>{
    fCat=d.dataset.cat;const cs=document.getElementById('catSel');
    if([...cs.options].some(o=>o.value===fCat)){cs.value=fCat;renderRows();}
  });
}

function renderBuild(){
  const box=document.getElementById('buildBody');
  const cats=[...new Set(ITEMS.map(i=>i.cat))];
  let ref=0,best=0,picks=0;
  let html='<div class="bgrid">';
  for(const c of cats){
    const items=ITEMS.filter(i=>i.cat===c).sort((a,b)=>a.price-b.price);
    const selName=BUILD[c];
    const opts=items.map(i=>{
      const ch=[i.jd,i.shop].filter(x=>x!=null);
      const b=ch.length?Math.min(i.price,...ch):i.price;
      return `<option value="${esc(i.name)}"${i.name===selName?' selected':''}>${esc(i.name.slice(0,24))} — ¥${Math.round(b).toLocaleString()}</option>`;
    }).join('');
    const sel=items.find(i=>i.name===selName);
    if(sel){picks++;ref+=sel.price;const ch=[sel.jd,sel.shop].filter(x=>x!=null);best+=ch.length?Math.min(sel.price,...ch):sel.price;}
    html+=`<label><span>${c}</span><select data-bcat="${c}"><option value="">— 不选 —</option>${opts}</select></label>`;
  }
  html+='</div>';
  html+=`<div class="btot">已选 <b>${picks}</b> 个类别 · 参考总价 <b>¥${Math.round(ref).toLocaleString()}</b> · 渠道最优总价 <b style="color:#0d7a3e">¥${Math.round(best).toLocaleString()}</b> · 至多可省 <b>¥${Math.round(ref-best).toLocaleString()}</b></div>`;
  box.innerHTML=html;
  box.querySelectorAll('select[data-bcat]').forEach(s=>s.onchange=()=>{
    if(s.value)BUILD[s.dataset.bcat]=s.value;else delete BUILD[s.dataset.bcat];
    saveBuild();renderBuild();
  });
}

function spark(hist){
  if(!hist||!hist.length)return '';
  const v=hist.slice(-30).map(h=>h.p);
  const w=100,h=26,pad=3;
  const lo=Math.min(...v),hi=Math.max(...v),span=hi-lo;
  const color=v.length>1?(v[v.length-1]>v[0]?UP:(v[v.length-1]<v[0]?DOWN:FLAT)):FLAT;
  const pts=v.map((p,i)=>{
    const x=pad+(w-2*pad)*(v.length>1?i/(v.length-1):0);
    const y=h-pad-(span?(h-2*pad)*(p-lo)/span:0);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

function drawChart(){
  const it=ITEMS[sel];if(!it)return;
  const s=S[it.name];
  document.getElementById('chart-title').textContent='— '+it.name;
  let hist;
  if(rangeN===-1){hist=(it.today||[]).map(x=>({d:'今日 '+x.h,p:x.p}));}
  else{hist=it.history||[];if(rangeN>0)hist=hist.slice(-rangeN);}
  const svg=document.getElementById('chart');
  const W=880,H=300,L=64,R=16,T=18,B=34;
  if(!hist.length){svg.innerHTML='<text x="440" y="150" text-anchor="middle" font-size="13" fill="${LBL}">暂无该时段数据</text>';return;}
  const vals=hist.map(h=>h.p);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(lo===hi){lo-=1;hi+=1;}
  const padY=(hi-lo)*0.12;lo-=padY;hi+=padY;
  const X=i=>L+(W-L-R)*(hist.length>1?i/(hist.length-1):0.5);
  const Y=p=>T+(H-T-B)*(1-(p-lo)/(hi-lo));
  const DK=document.documentElement.dataset.theme==='dark';
  const GRID=DK?'#2a3347':'#eef1f6', LBL=DK?'#8b95ad':'#8a93a3', HOV=DK?'#4a5touch':'#c6cfdd';
  const color=vals[vals.length-1]>vals[0]?UP:(vals[vals.length-1]<vals[0]?DOWN:FLAT);
  const yLabel=p=>(hi-lo)<10?p.toFixed(1):Math.round(p).toLocaleString();
  let g='';
  for(let k=0;k<=4;k++){
    const p=lo+(hi-lo)*k/4,y=Y(p);
    g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="${GRID}"/>`+
       `<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="${LBL}">${yLabel(p)}</text>`;
  }
  const lblIdx=hist.length<=2?hist.map((_,i)=>i):[0,Math.floor((hist.length-1)/2),hist.length-1];
  for(const i of lblIdx)g+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="${LBL}">${hist[i].d.length>6?hist[i].d.slice(-5):hist[i].d}</text>`;
  if(rangeN!==-1&&s.avg30){
    const ay=Y(Math.min(Math.max(s.avg30,lo),hi));
    g+=`<line x1="${L}" y1="${ay}" x2="${W-R}" y2="${ay}" stroke="#7a8b3c" stroke-dasharray="5 4" stroke-width="1.2"/>`+
       `<text x="${W-R}" y="${ay-5}" text-anchor="end" font-size="10.5" fill="#7a8b3c">30天均价 ${fmt(s.avg30)}</text>`;
  }
  const pts=vals.map((p,i)=>`${X(i).toFixed(1)},${Y(p).toFixed(1)}`).join(' ');
  const rf=it.real_from;
  let estLine='', startIdx=0;
  if(rf){
    const estIdx=[];
    hist.forEach((hh,i)=>{if(hh.d<rf)estIdx.push(i);});
    if(estIdx.length){
      startIdx=Math.max(...estIdx)+1;
      if(startIdx<hist.length){
        const ePts=vals.slice(0,startIdx+1).map((p,i)=>`${X(i).toFixed(1)},${Y(p).toFixed(1)}`).join(' ');
        estLine=`<polyline points="${ePts}" fill="none" stroke="#a9b6cc" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round"/>`;
      }
    }
  }
  const realPts=vals.slice(startIdx).map((p,i)=>`${X(i+startIdx).toFixed(1)},${Y(p).toFixed(1)}`).join(' ');
  const area=hist.length>1?`<polygon points="${X(0)},${H-B} ${pts} ${X(vals.length-1)},${H-B}" fill="${color}" opacity="0.07"/>`:'';
  const dot=`<circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="3.5" fill="${color}"/>`;
  let hover='';
  if(hoverX>=0&&hist.length>1){
    const i=Math.max(0,Math.min(hist.length-1,Math.round(hoverX/(W-L-R)*(hist.length-1))));
    hover=`<line x1="${X(i)}" y1="${T}" x2="${X(i)}" y2="${H-B}" stroke="${HOV}" stroke-dasharray="3 3"/>`+
          `<circle cx="${X(i)}" cy="${Y(vals[i])}" r="4" fill="#fff" stroke="${color}" stroke-width="2"/>`;
    const tt=document.getElementById('tooltip');
    tt.style.display='block';
    tt.style.left=Math.min(Math.max(X(i)/W*100,8),90)+'%';tt.style.top='6px';
    tt.innerHTML=`<b>${esc(hist[i].d)}</b>　${fmt(vals[i])}`;
  }else document.getElementById('tooltip').style.display='none';
  svg.innerHTML=g+area+estLine+(realPts?`<polyline points="${realPts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>`:'')+dot+hover;
  svg.onmousemove=e=>{
    const rect=svg.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*W;
    hoverX=(x>=L&&x<=W-R)?x-L:-1;
    drawChart();
  };
  svg.onmouseleave=()=>{hoverX=-1;drawChart();};
}

document.getElementById('range').onclick=e=>{
  if(e.target.dataset.n===undefined)return;
  rangeN=+e.target.dataset.n;
  document.querySelectorAll('#range button').forEach(b=>b.classList.toggle('on',b===e.target));

};
document.getElementById('search').oninput=e=>{fSearch=e.target.value.trim().toLowerCase();renderRows();};
document.getElementById('catSel').onchange=e=>{fCat=e.target.value;renderRows();};
document.getElementById('sortSel').onchange=e=>{fSort=e.target.value;renderRows();};
document.getElementById('onlyFav').onclick=e=>{onlyFav=!onlyFav;e.target.textContent=onlyFav?'★ 已只看收藏':'★ 只看收藏';renderRows();};
document.getElementById('fadvChip').onclick=()=>{fAdv=null;syncAdv();renderRows();};
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  localStorage.setItem('pth',t);
  document.getElementById('thBtn').textContent=t==='dark'?'☀️ 亮色':'🌙 主题';

document.getElementById('buildBtn').onclick=()=>{

document.getElementById('buildClear').onclick=()=>{BUILD={};saveBuild();renderBuild();};
document.getElementById('exportCsv').onclick=()=>{
  let csv='分类,商品,参考价,京东价,今日涨跌%,白菜价,URL\n';

// AI 自动管理面板：焦点商品 + 当日点评 + 今日推荐
function loadAiNote(){
  fetch('ai_notes.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(n=>{
    const el=document.getElementById('aiPanel');
    if(!n||!(n.summary||n.picks||n.focus)){el.style.display='none';return;}
    let html=`<span class="tag">AI 每日自动管理</span><span style="color:var(--sub);font-size:12px">${n.date} · ${n.model} 生成</span>`;
    if(n.focus)html+=`<div class="focus">🎯 <b>${esc(n.focus.name)}</b><span style="color:var(--sub);font-size:13px">${esc(n.focus.blurb)}</span></div>`;
    if(n.summary)html+=`<div class="sum">${esc(n.summary)}</div>`;
    if(n.picks&&n.picks.length)html+=`<div class="picks">`+n.picks.map(p=>`<span>★ ${esc(p.name)} — ${esc(p.reason)}</span>`).join('')+`</div>`;
    el.innerHTML=html;el.style.display='';
  }).catch(()=>{});
}

// 全网累计访问/使用人数：访问信标10分钟节流；人数信标每个浏览器终身一次；数值由云端每小时校准
let globalCount=null,globalUsers=null;
function pingVisits(){
  const now=Date.now(),last=+localStorage.getItem('ppvb')||0;
  if(now-last>600000){
    localStorage.setItem('ppvb',now);
    try{fetch('https://abacus.jasoncameron.dev/hit/pc-price-tracker/sgbd0-visits',{mode:'no-cors',cache:'no-store'});}catch(e){}
  }
  if(!localStorage.getItem('ppuv')){
    localStorage.setItem('ppuv','1');
    try{fetch('https://abacus.jasoncameron.dev/hit/pc-price-tracker/sgbd0-users',{mode:'no-cors',cache:'no-store'});}catch(e){}
  }
  const apply=()=>{
    document.querySelectorAll('#gv').forEach(el=>{if(globalCount!=null)el.textContent=globalCount.toLocaleString();});
    document.querySelectorAll('#gu').forEach(el=>{if(globalUsers!=null)el.textContent=globalUsers.toLocaleString();});
  };
  fetch('visit.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&d.count)globalCount=Number(d.count);
    if(d&&d.users!=null)globalUsers=Number(d.users);
    apply();
  }).catch(()=>{});
  setTimeout(apply,1500);
}

load();
pingVisits();
loadAiNote();
setInterval(load,10*60*1000);
