name: price-update

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点自动更新（UTC）
  workflow_dispatch:        # 支持网页手动触发
  push:
    branches: [main]        # 推送后立即跑一次

permissions:
  contents: write

concurrency:
  group: price-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 每天北京时间 09:00（UTC 01:00）那一轮加载 3B 模型写当日摘要；
      # 其余整点纯规则运行，几十秒完成，节省免费额度。
      - name: 安装模型运行库
        if: github.event_name != 'schedule' || github.event.schedule == '0 1 * * *'
        run: |
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            || pip install llama-cpp-python || true

      - name: 下载模型 Qwen2.5-3B（约2GB，仅每日一轮）
        if: github.event_name != 'schedule' || github.event.schedule == '0 1 * * *'
        run: python tracker.py model-setup || true

      - name: 更新价格（ZOL参考报价 + 京东渠道轮换）
        run: python tracker.py run

      - name: 回填历史快照+估算（每日/推送时）
        if: github.event_name != 'schedule' || github.event.schedule == '0 1 * * *'
        run: python tracker.py backfill || true

      - name: 渠道全量扫（每日/推送时：京东+商家报价）
        if: github.event_name != 'schedule' || github.event.schedule == '0 1 * * *'
        run: python tracker.py channel-sweep || true

      - name: 读全网计数写入 visit.json
        run: |
          V=$(curl -sf -m 20 "https://abacus.jasoncameron.dev/get/pc-price-tracker/sgbd0-visits" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])" 2>/dev/null || echo "")
          U=$(curl -sf -m 20 "https://abacus.jasoncameron.dev/get/pc-price-tracker/sgbd0-users" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])" 2>/dev/null || echo "0")
          if [ -n "$V" ] && [ "$V" != "0" ]; then
            printf '{"count": %s, "users": %s, "updated": "%s UTC"}\n' "$V" "${U:-0}" "$(date -u +'%Y-%m-%d %H:%M')" > web/visit.json
            cat web/visit.json
          else
            echo "计数服务暂时不可用，保留上次数值"
          fi

      - name: 把最新价格历史提交回仓库
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "价格无变化，跳过提交"
          else
            git commit -m "auto: update prices $(date -u +'%F %H:%M')"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包网页看板
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
